name: Build UV-K5 Bridge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi libnewlib-arm-none-eabi python3 python3-crcmod

      - name: Make
        run: make

      - name: Size
        run: arm-none-eabi-size firmware

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware*.bin
          
